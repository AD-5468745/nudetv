name: 누드TV 발행 시계

# ─────────────────────────────────────────────────────────────
# 언제 깨어나는가 — **공개 저장소 전제** (Actions 무제한 무료)
#
# 5분(*/5)을 걸어두었지만 **깃허브가 그대로 지켜주지 않습니다.**
# 실측: 저장소 생성 후 첫 실행까지 3시간 반, 그 뒤 17시간에 10회
# = 약 100분에 한 번. 이 값을 전제로 아래 두 설정을 맞춰두었습니다:
#
#   TICK_LOOKAHEAD_MINUTES=90   앞창 (예약보다 얼마나 일찍부터 처리하나)
#   TICK_INTERVAL_MINUTES=100   실측 간격 (게이트가 이걸로 창을 검사합니다)
#
# 정확한 시각이 필요한 날은 loop_hours 로 연속 운전하면 5분 간격이 됩니다.
#
# ⚠️ **비공개 저장소로 되돌리면 이 설정은 한도를 8배 초과합니다.**
#    그때는 아래 `*/5` 줄을 지우고 정각 줄들의 주석을 풀고,
#    TICK_INTERVAL_MINUTES 를 60 으로 되돌리세요.
# ─────────────────────────────────────────────────────────────
on:
  schedule:
    # **같은 5분 간격을 두 가지 표기로 겁니다.** 왜 둘인가:
    # 첫 배포 때 `*/5` 하나만 걸어두었더니 두 시간 넘게 한 번도 등록되지 않았습니다
    # (손으로 누른 실행 4회는 전부 정상). 깃허브가 새 저장소의 잦은 스케줄을 늦게
    # 켜는 것으로 보여, 표기가 다른 줄을 하나 더 두어 어느 쪽이든 걸리게 합니다.
    # 둘 다 켜져 겹쳐 돌아도 아래 concurrency가 막으므로 중복 발송은 없습니다.
    - cron: '*/5 * * * *'
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 * * * *'
    # ↓ 비공개로 되돌릴 때 쓰는 설정 (하루 27회)
    # - cron: '0 * * * *'
    # - cron: '15 22 * * *'
    # - cron: '30 9 * * *'
    # - cron: '30 13 * * *'
  workflow_dispatch:             # 손으로 즉시 실행할 때
    inputs:
      dry_run:
        description: '드라이런(발송하지 않고 계획만 확인)'
        type: boolean
        default: true
      loop_hours:
        # **깃허브 자동 시계가 안 켜질 때를 위한 비상 수단입니다.**
        # 0이면 평소대로 한 번만 일하고 끝납니다.
        # 0보다 크면 그 시간 동안 실행 하나가 살아 있으면서 5분마다 일합니다.
        # 공개 저장소는 실행 시간이 무제한이라 비용은 그대로 0원입니다.
        # 한 실행의 상한이 6시간이므로 5.5를 넘겨 넣지 마세요.
        description: '비상 연속 운전 시간 (0=한 번만, 예: 5.5)'
        type: string
        default: '0'
      chain:
        # 자체 재예약(사슬)의 깊이입니다. 사람이 손으로 넣을 일은 없습니다 —
        # 시계가 다음 실행을 예약할 때 스스로 1씩 올립니다.
        # 폭주 안전장치로 상한을 두기 위해 있습니다.
        description: '(자동) 자체 재예약 깊이 — 손대지 마세요'
        type: string
        default: '0'

# 앞 실행이 아직 돌고 있으면 기다립니다.
# 겹쳐 돌면 같은 카드를 두 번 보낼 수 있습니다 — 되돌릴 수 없는 사고입니다.
concurrency:
  group: nudetv-tick
  cancel-in-progress: false

permissions:
  contents: write                # 발송 대장(state/)을 커밋해야 합니다

jobs:
  tick:
    runs-on: ubuntu-latest
    # 평소 한 번 실행은 2분이면 끝납니다. 상한을 크게 두는 이유는 비상
    # 연속 운전(loop_hours) 때문입니다 — 깃허브 한 실행의 상한이 6시간이라
    # 그보다 조금 아래로 잡습니다. 매달려 있어도 공개 저장소는 비용이 0원입니다.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 크로미움 캐시
        # 카드는 브라우저로 그립니다. 매번 내려받으면 회당 1분이 더 듭니다.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1

      - name: 경기 데이터 복원
        # **경기 데이터는 커밋하지 않습니다.** 5분마다 도니 하루 288번인데,
        # 점수가 바뀔 때마다 커밋하면 저장소가 커밋으로 뒤덮입니다.
        # 사라져도 다시 수집하면 그만이라 캐시가 맞는 자리입니다.
        # (발송 대장은 다릅니다 — 사라지면 오늘 것을 다시 보내므로 반드시 커밋합니다.)
        #
        # 세 가지를 함께 나릅니다. 하나라도 빠지면 나머지가 무의미해집니다:
        #   state/games      — 수집한 경기들
        #   state/fetch.json — **"어느 리그를 언제 마지막으로 긁었나" 수첩.**
        #                      이게 사라지면 30분 제동장치가 풀려 5분마다 전 리그를
        #                      새로 긁습니다(하루 288번). 소스가 차단합니다.
        #   g1/cache         — LoL 원본 보관함. 호출 한도에 걸린 날 여기서 꺼내 버팁니다.
        #
        #   state/ticks.json — **"시계가 실제로 몇 분마다 도는가"의 유일한 근거입니다.**
        #                      이게 없어서 실측 간격이 늘 0초로 나왔고, 발송 창
        #                      게이트는 사람이 손으로 적은 100분(스스로 통과하도록
        #                      맞춰둔 값)만 보게 되어 **무조건 통과**했습니다.
        #                      커밋이 아니라 캐시에 두는 이유: 매 실행 내용이 바뀌므로
        #                      커밋하면 하루 최대 288커밋이 되고, 무엇보다 아래
        #                      **대장 커밋의 리베이스 충돌 확률을 올립니다** — 대장
        #                      커밋이 실패하면 그날 것을 전부 다시 보냅니다.
        #                      이 파일은 잃어도 '게이트가 몇 틱 눈을 감는' 정도이고,
        #                      틱이 기록 부족을 알림에 실어 조용히 사라지지 않습니다.
        #   state/ledger_mark.json
        #                    — 대장 유실 감시 표식(줄 수·발송 수).
        #                      **대장(git)과 일부러 다른 저장소(캐시)에 둡니다.**
        #                      대장 커밋이 실패해 다음 실행의 대장이 되감기면,
        #                      이 표식이 그것을 잡아 발송을 통째로 보류합니다.
        uses: actions/cache/restore@v4
        with:
          path: |
            state/games
            state/fetch.json
            state/ticks.json
            state/ledger_mark.json
            g1/cache
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: 설치
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow
          python -m playwright install --with-deps chromium
          # **한글 폰트.** 이게 없으면 크로미움이 한글을 조용히 두부(□□□)로 그립니다.
          # 오류도 경고도 없이, 숫자 검증은 전부 통과한 채로 두부 카드가 나갑니다.
          # 우분투 서버에는 기본으로 깔려 있지 않습니다 — 개발 컴퓨터에만 있었습니다.
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji
          fc-list :lang=ko family | head -3

      - name: 시계 실행
        id: run
        env:
          # 값은 저장소 Settings → Secrets and variables → Actions 에 넣습니다.
          # 이 파일에는 절대 값을 적지 않습니다.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          NUDETV_STATE: ${{ github.workspace }}/state
          WORKER_ID: gha-${{ github.run_id }}
          # 시작 알림을 경기 몇 분 전에 보낼지 (대표님 지정: 2시간 전).
          START_ALERT_LEAD_MINUTES: '120'
          # 한 번 깨어날 때 앞으로 몇 분치 큐를 처리할지 — **시계 간격과 맞춥니다.**
          # 깃허브에 5분(*/5)을 걸어두었지만 **실측 간격은 약 100분**이었습니다
          # (17시간에 10회). 6분으로 두었더니 예약 시각이 그 창에 안 들어와
          # 모닝 브리핑과 시작 알림이 하루 종일 한 건도 못 나갔습니다.
          # 90분이면 100분 시계에서도 대부분 걸립니다.
          #
          # 일찍 나가면 안 되는 콘텐츠(모닝 브리핑)는 이 값과 무관하게
          # contract.LOOKAHEAD_SECONDS_BY_CONTENT 에서 0으로 잠가 두었습니다.
          TICK_LOOKAHEAD_MINUTES: '90'
          # 시계가 **실제로** 몇 분마다 도는지(설정값이 아니라 실측값).
          # 이 값으로 매 실행 "발송 창이 시계 간격보다 넓은가"를 검사합니다.
          # 창이 좁으면 오류 없이 조용히 아무것도 안 나가므로 미리 막습니다.
          TICK_INTERVAL_MINUTES: '100'
          # ── 자동 시계에서도 연속 운전을 켭니다 (v1.11k) ─────────────
          # **토큰 없이 시계를 규칙적으로 만드는 유일한 방법입니다.**
          #
          # 깃허브 자동 시계는 `*/5`로 걸어도 실측 30분~4시간 불규칙입니다.
          # 그 위에서는 "규칙적으로 알리기"와 "빠짐없이 보내기"를 동시에 만족하는
          # 설정이 존재하지 않습니다(앞창 1분을 좁힐 때마다 정확도 0.3분을 얻고
          # 유실 0.22%p를 냅니다 — 실측 교환비).
          #
          # 연속 운전은 실행 하나가 5.5시간 살면서 **5분마다** 일합니다.
          # 자체 재예약(사슬)만 토큰이 필요하고, 연속 운전 자체는 필요 없습니다.
          # 그런데 전에는 `inputs.loop_hours || '0'` 이라 **크론 실행은 항상 0**이었고,
          # 손으로 실행할 때만 켜졌습니다. 그래서 실제로는 한 번도 안 쓰였습니다.
          #
          # 이제 크론이 시작한 실행은 기본 5.5시간 연속 운전합니다.
          #   · 크론이 뜸해도 한 번만 걸리면 그 뒤 5.5시간은 5분 간격입니다.
          #   · concurrency가 겹침을 막고, 끝나면 대기 중이던 실행이 이어받습니다.
          #   · 공개 저장소는 실행 시간 무제한이라 비용은 0원입니다.
          #   · 손으로 실행할 때(workflow_dispatch)는 입력 기본값 '0'이 그대로 들어와
          #     예전처럼 한 번만 돌고 끝납니다 — 빠른 확인용입니다.
          LOOP_HOURS: ${{ inputs.loop_hours || '5.5' }}
        run: |
          set +e
          rm -f "$GITHUB_WORKSPACE/.loop_done"
          DRY=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY="--dry-run"
          fi

          # 대장을 남기는 함수 — 연속 운전 중에도 매번 남겨야 합니다.
          # 실행이 6시간을 살다 중간에 죽으면, 그때까지 보낸 기록이 없어져
          # **이미 보낸 카드를 다시 보냅니다.** 되돌릴 수 없는 사고입니다.
          #
          # **실패를 실패로 돌려줍니다 (v1.11i).** 전에는 3회 다 실패해도
          # 루프가 그냥 끝나 함수의 반환값이 마지막 `sleep`의 0이었습니다 —
          # 대장이 안 올라갔는데 아무도 몰랐고, 다음 실행이 모닝·시작알림·결과를
          # 전부 다시 보냈습니다. 이제 실패하면 1을 돌려주고 연속 운전을 멈춥니다
          # (대장 없이 계속 보내는 것보다 멈추는 편이 낫습니다).
          save_ledger() {
            git add -A state/ledger.jsonl state/alerts.json state/burst.json \
                       state/.gitkeep 2>/dev/null || true
            git diff --cached --quiet && return 0
            git commit -q -m "state: $(date -u +'%Y-%m-%d %H:%M') UTC" || return 1
            for i in 1 2 3; do
              git pull -q --rebase --autostash && git push -q && return 0
              sleep $((i * 5))
            done
            echo "::error::발송 대장을 저장소에 올리지 못했습니다 — 다음 실행이 재발송할 위험이 있어 연속 운전을 멈춥니다."
            return 1
          }
          git config user.name  "nudetv-bot"
          git config user.email "bot@users.noreply.github.com"

          LOOPS=$(python -c "print(int(float('${LOOP_HOURS:-0}') * 12))" 2>/dev/null || echo 0)
          if [ "$LOOPS" -le 0 ]; then
            python g1/tick.py $DRY          # 평소: 한 번 일하고 끝
            exit $?
          fi

          # 비상 연속 운전 — 깃허브 자동 시계가 안 켜질 때만 씁니다.
          echo "비상 연속 운전: 5분 간격 ${LOOPS}회 (약 ${LOOP_HOURS}시간)"
          LAST=0
          for i in $(seq 1 "$LOOPS"); do
            echo "───── ${i}/${LOOPS} ─────"
            python g1/tick.py $DRY
            LAST=$?
            # 대장을 못 올렸으면 **더 보내지 않고 멈춥니다.**
            # 그대로 계속 돌면, 이 실행이 죽는 순간 그때까지 보낸 것이 통째로
            # 유실되어 다음 실행이 전량 재발송합니다.
            if ! save_ledger; then
              echo "대장 저장 실패 — 연속 운전을 중단합니다."
              LAST=1
              break
            fi
            [ "$i" -lt "$LOOPS" ] && sleep 300
          done
          # 연속 운전을 **끝까지** 마쳤다는 표시입니다. 다음 실행을 예약할지
          # 판단하는 유일한 근거입니다 — 중간에 죽은 실행이 사슬을 이어가면
          # 몇 초짜리 실행이 끝없이 서로를 부르는 폭주가 됩니다.
          touch "$GITHUB_WORKSPACE/.loop_done"
          exit $LAST
        continue-on-error: true   # 실패해도 아래 커밋은 해야 합니다(중간까지의 발송 기록 보존)

      - name: 카드 미리보기 올리기
        # 드라이런에서 그린 카드입니다. **눈으로 확인하는 마지막 관문**입니다 —
        # 색·아이콘·폰트처럼 숫자 검증이 못 잡는 것은 사람이 봐야 압니다.
        # 실행 화면 아래 Artifacts에서 내려받아 보세요.
        if: always() && github.event_name == 'workflow_dispatch' && inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: 카드-미리보기
          path: state/render/
          retention-days: 7
          if-no-files-found: warn

      - name: 경기 데이터 저장
        # **`always()`가 핵심입니다.** 기본 캐시 동작은 "성공한 실행만 저장"인데,
        # 그러면 이런 덫에 빠집니다:
        #   호출 한도에 걸림 → 실패 → 캐시 저장 안 됨 → 다음에도 캐시 없음 →
        #   또 한도에 걸림 → 영원히 못 빠져나옴.
        # 실제로 첫 실행이 정확히 이 덫에 걸렸습니다. 그래서 실패해도 저장합니다.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state/games
            state/fetch.json
            state/ticks.json
            state/ledger_mark.json
            g1/cache
          key: data-${{ github.run_id }}

      - name: 발송 대장 저장
        # **이 단계가 이 워크플로에서 가장 중요합니다.**
        # 대장이 남지 않으면 다음 실행이 오늘 것을 다시 보냅니다.
        # 그래서 시계가 실패했더라도 무조건 커밋합니다.
        if: always()
        run: |
          git config user.name  "nudetv-bot"
          git config user.email "bot@users.noreply.github.com"
          # 대장만 커밋합니다. 경기 데이터(state/games)는 캐시가 들고 있습니다.
          # alerts.json도 함께 — **이게 없으면 같은 알림이 5분마다 다시 나갑니다**
          # (매 실행이 새 컨테이너라 "방금 보냈다"를 파일로만 기억할 수 있습니다).
          # burst.json도 함께 — 폭주 차단 상태가 실행 사이에 살아남아야
          # 차단이 뜻을 갖습니다(메모리에 두면 다음 실행이 또 폭주합니다).
          git add -A state/ledger.jsonl state/alerts.json state/burst.json \
                     state/.gitkeep 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "state: $(date -u +'%Y-%m-%d %H:%M') UTC"
          # 다른 실행이 먼저 밀어 넣었을 수 있습니다. 우리 것을 덮어쓰지 않고 얹습니다.
          #
          # **3회 다 실패하면 이 스텝을 실패로 끝냅니다 (v1.11i).**
          # 전에는 `for … do … && break; sleep …; done` 이라 세 번 다 실패해도
          # 루프가 정상 종료하고 스텝의 exit code는 마지막 `sleep`의 0이었습니다.
          # 대장이 안 올라가면 다음 실행은 그 회차 발송분을 모르고
          # **모닝·시작알림·결과를 전부 다시 보냅니다** — 되돌릴 수 없는 사고인데
          # 로그는 초록불이었습니다. 이제 빨간불로 드러납니다.
          # (틱 쪽에도 방어가 있습니다: state/ledger_mark.json 표식이 캐시에 남아,
          #  다음 실행에서 대장이 되감긴 것을 보면 발송을 통째로 보류합니다.)
          for i in 1 2 3; do
            if git pull --rebase --autostash && git push; then
              echo "대장 저장 완료"
              exit 0
            fi
            sleep $((i * 5))
          done
          echo "::error::발송 대장을 3회 시도 모두 저장하지 못했습니다. 다음 실행이 오늘 것을 다시 보낼 수 있습니다 — 즉시 확인하세요."
          exit 1

      - name: 다음 실행 예약 (시계 안정화)
        # ─────────────────────────────────────────────────────────
        # **왜 필요한가.** 5분(*/5)을 걸어두었지만 깃허브 무료 스케줄러는
        # 실측 30분~4시간 불규칙으로 돕니다(2026-08-31 하루 관찰).
        # 그래서 "언제 보낼지"를 아무리 정확히 계산해도, 그 시각에 시계가
        # 자고 있으면 늦게 나가거나 유예를 넘겨 사라집니다.
        #
        # **어떻게 고치나.** 실행 하나가 5시간 반 동안 살면서 5분마다 일하고,
        # 끝나기 직전에 스스로 다음 실행을 예약합니다. 하루 4~5번만 예약하므로
        # API 호출이 거의 없고, 공개 저장소는 실행 시간이 무제한이라 비용은 0원입니다.
        #
        # **폭주를 막는 세 겹.**
        #   ① 토큰이 없으면 아무 일도 안 합니다 (지금과 완전히 동일하게 동작).
        #   ② 다른 실행이 이미 돌거나 대기 중이면 예약하지 않습니다 — 사슬은 하나뿐.
        #   ③ 연속 운전을 끝까지 마친 실행만 다음을 부릅니다(.loop_done 표시).
        #      중간에 죽으면 사슬이 끊기고, 기존 크론이 다시 시작해 줍니다.
        #   ④ 사슬 깊이 상한. 여기 닿으면 스스로 멈추고 크론에 넘깁니다.
        # ─────────────────────────────────────────────────────────
        if: always()
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          # 위 실행 스텝과 **같은 값이어야 합니다** (v1.11k).
          # 크론 실행도 이제 연속 운전을 하므로, 여기서 '0'으로 읽으면
          # "연속 운전을 끝까지 마쳤는가(.loop_done)" 검사를 건너뛰게 됩니다.
          # 그러면 중간에 죽은 실행이 사슬을 이어 폭주할 수 있습니다.
          LOOP_HOURS: ${{ inputs.loop_hours || '5.5' }}
          CHAIN_IN: ${{ inputs.chain || '0' }}
        run: |
          set -u
          if [ -z "${DISPATCH_TOKEN:-}" ]; then
            echo "DISPATCH_TOKEN이 없습니다 — 자체 예약을 건너뜁니다(크론이 계속 맡습니다)."
            exit 0
          fi

          # ③ 연속 운전이었다면 끝까지 마쳤을 때만 사슬을 잇습니다.
          if [ "${LOOP_HOURS:-0}" != "0" ] && [ ! -f "$GITHUB_WORKSPACE/.loop_done" ]; then
            echo "연속 운전이 끝까지 가지 못했습니다 — 사슬을 끊습니다(크론이 다시 시작합니다)."
            exit 0
          fi

          # ④ 사슬 깊이 상한 — 한 사슬이 5.5시간이므로 200이면 약 45일입니다.
          CHAIN=$(( ${CHAIN_IN:-0} + 1 ))
          if [ "$CHAIN" -gt 200 ]; then
            echo "사슬 상한에 닿았습니다 — 크론에 넘깁니다."
            exit 0
          fi

          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/tick.yml"
          H_AUTH="Authorization: Bearer ${DISPATCH_TOKEN}"
          H_ACC="Accept: application/vnd.github+json"

          # ② 나 말고 돌고 있거나 대기 중인 실행이 있으면 예약하지 않습니다.
          #    두 개가 각자 예약하면 사슬이 둘로 갈라져 발송이 겹칠 수 있습니다.
          busy=0
          for st in in_progress queued; do
            n=$(curl -sS -H "$H_AUTH" -H "$H_ACC" "$API/runs?per_page=50&status=$st" | python3 -c "import sys,json,os; d=json.load(sys.stdin); me=os.environ.get('GITHUB_RUN_ID',''); print(sum(1 for r in d.get('workflow_runs',[]) if str(r.get('id'))!=me))" 2>/dev/null || echo "")
            case "$n" in ''|*[!0-9]*) echo "실행 목록을 못 읽었습니다 — 안전하게 예약을 건너뜁니다."; exit 0;; esac
            busy=$(( busy + n ))
          done
          if [ "$busy" -gt 0 ]; then
            echo "다른 실행이 ${busy}개 있습니다 — 예약하지 않습니다(사슬은 하나만 둡니다)."
            exit 0
          fi

          echo "다음 실행을 예약합니다 (사슬 ${CHAIN}, 연속 운전 5.5시간)."
          code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "$H_AUTH" -H "$H_ACC" "$API/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"dry_run\":\"false\",\"loop_hours\":\"5.5\",\"chain\":\"${CHAIN}\"}}")
          if [ "$code" = "204" ]; then
            echo "예약 완료."
          else
            # 실패해도 이 실행을 실패로 만들지 않습니다 — 크론이 받아줍니다.
            echo "예약 실패(HTTP ${code}). 크론이 이어받습니다: $(head -c 300 /tmp/dispatch.out)"
          fi

      - name: 결과 판정
        # 커밋을 마친 뒤에 실패를 알립니다 — 순서가 반대면 대장이 유실됩니다.
        if: steps.run.outcome == 'failure'
        run: |
          echo "시계가 오류로 끝났습니다. 위 로그를 확인하세요."
          exit 1

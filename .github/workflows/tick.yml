name: 누드TV 발행 시계

# ─────────────────────────────────────────────────────────────
# 언제 깨어나는가 — **공개 저장소 전제** (Actions 무제한 무료)
#
# 5분(*/5)을 걸어두었지만 **깃허브가 그대로 지켜주지 않습니다.**
# 실측: 저장소 생성 후 첫 실행까지 3시간 반, 그 뒤 17시간에 10회
# = 약 100분에 한 번. 이 값을 전제로 아래 두 설정을 맞춰두었습니다:
#
#   TICK_LOOKAHEAD_MINUTES=90   앞창 (예약보다 얼마나 일찍부터 처리하나)
#   TICK_INTERVAL_MINUTES=100   실측 간격 (게이트가 이걸로 창을 검사합니다)
#
# 정확한 시각이 필요한 날은 loop_hours 로 연속 운전하면 5분 간격이 됩니다.
#
# ⚠️ **비공개 저장소로 되돌리면 이 설정은 한도를 8배 초과합니다.**
#    그때는 아래 `*/5` 줄을 지우고 정각 줄들의 주석을 풀고,
#    TICK_INTERVAL_MINUTES 를 60 으로 되돌리세요.
# ─────────────────────────────────────────────────────────────
on:
  schedule:
    # **같은 5분 간격을 두 가지 표기로 겁니다.** 왜 둘인가:
    # 첫 배포 때 `*/5` 하나만 걸어두었더니 두 시간 넘게 한 번도 등록되지 않았습니다
    # (손으로 누른 실행 4회는 전부 정상). 깃허브가 새 저장소의 잦은 스케줄을 늦게
    # 켜는 것으로 보여, 표기가 다른 줄을 하나 더 두어 어느 쪽이든 걸리게 합니다.
    # 둘 다 켜져 겹쳐 돌아도 아래 concurrency가 막으므로 중복 발송은 없습니다.
    - cron: '*/5 * * * *'
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 * * * *'
    # ↓ 비공개로 되돌릴 때 쓰는 설정 (하루 27회)
    # - cron: '0 * * * *'
    # - cron: '15 22 * * *'
    # - cron: '30 9 * * *'
    # - cron: '30 13 * * *'
  workflow_dispatch:             # 손으로 즉시 실행할 때
    inputs:
      dry_run:
        description: '드라이런(발송하지 않고 계획만 확인)'
        type: boolean
        default: true
      loop_hours:
        # **깃허브 자동 시계가 안 켜질 때를 위한 비상 수단입니다.**
        # 0이면 평소대로 한 번만 일하고 끝납니다.
        # 0보다 크면 그 시간 동안 실행 하나가 살아 있으면서 5분마다 일합니다.
        # 공개 저장소는 실행 시간이 무제한이라 비용은 그대로 0원입니다.
        # 한 실행의 상한이 6시간이므로 5.5를 넘겨 넣지 마세요.
        description: '비상 연속 운전 시간 (0=한 번만, 예: 5.5)'
        type: string
        default: '0'

# 앞 실행이 아직 돌고 있으면 기다립니다.
# 겹쳐 돌면 같은 카드를 두 번 보낼 수 있습니다 — 되돌릴 수 없는 사고입니다.
concurrency:
  group: nudetv-tick
  cancel-in-progress: false

permissions:
  contents: write                # 발송 대장(state/)을 커밋해야 합니다

jobs:
  tick:
    runs-on: ubuntu-latest
    # 평소 한 번 실행은 2분이면 끝납니다. 상한을 크게 두는 이유는 비상
    # 연속 운전(loop_hours) 때문입니다 — 깃허브 한 실행의 상한이 6시간이라
    # 그보다 조금 아래로 잡습니다. 매달려 있어도 공개 저장소는 비용이 0원입니다.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 크로미움 캐시
        # 카드는 브라우저로 그립니다. 매번 내려받으면 회당 1분이 더 듭니다.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1

      - name: 경기 데이터 복원
        # **경기 데이터는 커밋하지 않습니다.** 5분마다 도니 하루 288번인데,
        # 점수가 바뀔 때마다 커밋하면 저장소가 커밋으로 뒤덮입니다.
        # 사라져도 다시 수집하면 그만이라 캐시가 맞는 자리입니다.
        # (발송 대장은 다릅니다 — 사라지면 오늘 것을 다시 보내므로 반드시 커밋합니다.)
        #
        # 세 가지를 함께 나릅니다. 하나라도 빠지면 나머지가 무의미해집니다:
        #   state/games      — 수집한 경기들
        #   state/fetch.json — **"어느 리그를 언제 마지막으로 긁었나" 수첩.**
        #                      이게 사라지면 30분 제동장치가 풀려 5분마다 전 리그를
        #                      새로 긁습니다(하루 288번). 소스가 차단합니다.
        #   g1/cache         — LoL 원본 보관함. 호출 한도에 걸린 날 여기서 꺼내 버팁니다.
        uses: actions/cache/restore@v4
        with:
          path: |
            state/games
            state/fetch.json
            g1/cache
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: 설치
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow
          python -m playwright install --with-deps chromium
          # **한글 폰트.** 이게 없으면 크로미움이 한글을 조용히 두부(□□□)로 그립니다.
          # 오류도 경고도 없이, 숫자 검증은 전부 통과한 채로 두부 카드가 나갑니다.
          # 우분투 서버에는 기본으로 깔려 있지 않습니다 — 개발 컴퓨터에만 있었습니다.
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji
          fc-list :lang=ko family | head -3

      - name: 시계 실행
        id: run
        env:
          # 값은 저장소 Settings → Secrets and variables → Actions 에 넣습니다.
          # 이 파일에는 절대 값을 적지 않습니다.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          NUDETV_STATE: ${{ github.workspace }}/state
          WORKER_ID: gha-${{ github.run_id }}
          # 시작 알림을 경기 몇 분 전에 보낼지 (대표님 지정: 2시간 전).
          START_ALERT_LEAD_MINUTES: '120'
          # 한 번 깨어날 때 앞으로 몇 분치 큐를 처리할지 — **시계 간격과 맞춥니다.**
          # 깃허브에 5분(*/5)을 걸어두었지만 **실측 간격은 약 100분**이었습니다
          # (17시간에 10회). 6분으로 두었더니 예약 시각이 그 창에 안 들어와
          # 모닝 브리핑과 시작 알림이 하루 종일 한 건도 못 나갔습니다.
          # 90분이면 100분 시계에서도 대부분 걸립니다.
          #
          # 일찍 나가면 안 되는 콘텐츠(모닝 브리핑)는 이 값과 무관하게
          # contract.LOOKAHEAD_SECONDS_BY_CONTENT 에서 0으로 잠가 두었습니다.
          TICK_LOOKAHEAD_MINUTES: '90'
          # 시계가 **실제로** 몇 분마다 도는지(설정값이 아니라 실측값).
          # 이 값으로 매 실행 "발송 창이 시계 간격보다 넓은가"를 검사합니다.
          # 창이 좁으면 오류 없이 조용히 아무것도 안 나가므로 미리 막습니다.
          TICK_INTERVAL_MINUTES: '100'
          LOOP_HOURS: ${{ inputs.loop_hours || '0' }}
        run: |
          set +e
          DRY=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY="--dry-run"
          fi

          # 대장을 남기는 함수 — 연속 운전 중에도 매번 남겨야 합니다.
          # 실행이 6시간을 살다 중간에 죽으면, 그때까지 보낸 기록이 없어져
          # **이미 보낸 카드를 다시 보냅니다.** 되돌릴 수 없는 사고입니다.
          save_ledger() {
            git add -A state/ledger.jsonl state/alerts.json state/.gitkeep 2>/dev/null || true
            git diff --cached --quiet && return 0
            git commit -q -m "state: $(date -u +'%Y-%m-%d %H:%M') UTC" || return 0
            for i in 1 2 3; do
              git pull -q --rebase --autostash && git push -q && return 0
              sleep $((i * 5))
            done
          }
          git config user.name  "nudetv-bot"
          git config user.email "bot@users.noreply.github.com"

          LOOPS=$(python -c "print(int(float('${LOOP_HOURS:-0}') * 12))" 2>/dev/null || echo 0)
          if [ "$LOOPS" -le 0 ]; then
            python g1/tick.py $DRY          # 평소: 한 번 일하고 끝
            exit $?
          fi

          # 비상 연속 운전 — 깃허브 자동 시계가 안 켜질 때만 씁니다.
          echo "비상 연속 운전: 5분 간격 ${LOOPS}회 (약 ${LOOP_HOURS}시간)"
          LAST=0
          for i in $(seq 1 "$LOOPS"); do
            echo "───── ${i}/${LOOPS} ─────"
            python g1/tick.py $DRY
            LAST=$?
            save_ledger
            [ "$i" -lt "$LOOPS" ] && sleep 300
          done
          exit $LAST
        continue-on-error: true   # 실패해도 아래 커밋은 해야 합니다(중간까지의 발송 기록 보존)

      - name: 카드 미리보기 올리기
        # 드라이런에서 그린 카드입니다. **눈으로 확인하는 마지막 관문**입니다 —
        # 색·아이콘·폰트처럼 숫자 검증이 못 잡는 것은 사람이 봐야 압니다.
        # 실행 화면 아래 Artifacts에서 내려받아 보세요.
        if: always() && github.event_name == 'workflow_dispatch' && inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: 카드-미리보기
          path: state/render/
          retention-days: 7
          if-no-files-found: warn

      - name: 경기 데이터 저장
        # **`always()`가 핵심입니다.** 기본 캐시 동작은 "성공한 실행만 저장"인데,
        # 그러면 이런 덫에 빠집니다:
        #   호출 한도에 걸림 → 실패 → 캐시 저장 안 됨 → 다음에도 캐시 없음 →
        #   또 한도에 걸림 → 영원히 못 빠져나옴.
        # 실제로 첫 실행이 정확히 이 덫에 걸렸습니다. 그래서 실패해도 저장합니다.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state/games
            state/fetch.json
            g1/cache
          key: data-${{ github.run_id }}

      - name: 발송 대장 저장
        # **이 단계가 이 워크플로에서 가장 중요합니다.**
        # 대장이 남지 않으면 다음 실행이 오늘 것을 다시 보냅니다.
        # 그래서 시계가 실패했더라도 무조건 커밋합니다.
        if: always()
        run: |
          git config user.name  "nudetv-bot"
          git config user.email "bot@users.noreply.github.com"
          # 대장만 커밋합니다. 경기 데이터(state/games)는 캐시가 들고 있습니다.
          # alerts.json도 함께 — **이게 없으면 같은 알림이 5분마다 다시 나갑니다**
          # (매 실행이 새 컨테이너라 "방금 보냈다"를 파일로만 기억할 수 있습니다).
          git add -A state/ledger.jsonl state/alerts.json state/.gitkeep 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "state: $(date -u +'%Y-%m-%d %H:%M') UTC"
            # 다른 실행이 먼저 밀어 넣었을 수 있습니다. 우리 것을 덮어쓰지 않고 얹습니다.
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              sleep $((i * 5))
            done
          fi

      - name: 결과 판정
        # 커밋을 마친 뒤에 실패를 알립니다 — 순서가 반대면 대장이 유실됩니다.
        if: steps.run.outcome == 'failure'
        run: |
          echo "시계가 오류로 끝났습니다. 위 로그를 확인하세요."
          exit 1
